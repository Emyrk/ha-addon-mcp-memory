daemon off;
pid /run/nginx.pid;
worker_processes 1;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;
    types_hash_max_size 4096;
    gzip off;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Upstream is the real mcp-memory-service HTTP server (loopback only).
    upstream backend {
        server 127.0.0.1:8001;
        keepalive 8;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    server {
        # Single listener used for BOTH:
        #   - HA Ingress (HA -> 127.0.0.1:8000 inside container)
        #   - Direct LAN access on http://<ha-host>:8000/
        # Ingress sets X-Ingress-Path; direct access leaves it empty,
        # so the sub_filter rewrites become no-ops.
        listen 8000 default_server;

        # Allow large request bodies (document ingestion, etc.)
        client_max_body_size 64m;

        # Capture HA Ingress prefix; empty string for direct access.
        set $ingress "";
        if ($http_x_ingress_path) {
            set $ingress $http_x_ingress_path;
        }

        # SSE event stream — must NOT be buffered or sub_filter'd, or events
        # won't reach the browser in real time. Put this BEFORE the generic
        # location / so it wins for /api/events.
        location /api/events {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Ingress-Path    $http_x_ingress_path;
            proxy_set_header Connection        "";
            proxy_buffering         off;
            proxy_cache             off;
            proxy_read_timeout      86400s;
            proxy_send_timeout      86400s;
            chunked_transfer_encoding off;
        }

        # MCP streamable HTTP — also a long-lived stream, skip rewrites.
        location /mcp {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Ingress-Path    $http_x_ingress_path;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;
            proxy_buffering         off;
            proxy_request_buffering off;
            proxy_read_timeout      86400s;
            proxy_send_timeout      86400s;
        }

        location / {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Ingress-Path    $http_x_ingress_path;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;

            # sub_filter requires uncompressed responses AND buffering.
            # (Disabling proxy_buffering kills sub_filter silently — that
            # was the v0.4.1 bug.)
            proxy_set_header Accept-Encoding "";
            proxy_buffering         on;
            proxy_buffers           16 32k;
            proxy_busy_buffers_size 64k;
            proxy_read_timeout      120s;
            proxy_send_timeout      120s;

            # Rewrite root-absolute URLs the upstream UI emits so they
            # resolve under HA's Ingress path prefix when present.
            sub_filter_once  off;
            # Cover every content-type FastAPI/uvicorn might emit for JS.
            # FastAPI's StaticFiles returns `text/javascript` (not
            # `application/javascript`) on Python 3.10+, so the latter wasn't
            # matching — that's why prior versions left `'/api'` untouched.
            sub_filter_types
                text/html
                text/css
                text/javascript
                application/javascript
                application/x-javascript
                application/json;

            sub_filter 'href="/'   'href="$ingress/';
            sub_filter "href='/"   "href='$ingress/";
            sub_filter 'src="/'    'src="$ingress/';
            sub_filter "src='/"    "src='$ingress/";
            sub_filter 'action="/' 'action="$ingress/';
            sub_filter 'url(/'     'url($ingress/';
            sub_filter 'url("/'    'url("$ingress/';
            sub_filter "url('/"    "url('$ingress/";

            # JS string literals that fetch APIs / assets.
            # NOTE: also catch bare `'/api'` (without trailing slash) because
            # the dashboard sets `this.apiBase = '/api'` and concatenates
            # endpoints onto it — without these the prefix is lost.
            sub_filter "'/api'"    "'$ingress/api'";
            sub_filter '"/api"'    '"$ingress/api"';
            sub_filter '"/api/'    '"$ingress/api/';
            sub_filter "'/api/"    "'$ingress/api/";
            sub_filter "'/static'" "'$ingress/static'";
            sub_filter '"/static"' '"$ingress/static"';
            sub_filter '"/static/' '"$ingress/static/';
            sub_filter "'/static/" "'$ingress/static/";
            sub_filter "'/mcp'"    "'$ingress/mcp'";
            sub_filter '"/mcp"'    '"$ingress/mcp"';
            sub_filter '"/mcp/'    '"$ingress/mcp/';
            sub_filter "'/mcp/"    "'$ingress/mcp/";
            sub_filter "'/sse'"    "'$ingress/sse'";
            sub_filter '"/sse"'    '"$ingress/sse"';
            sub_filter '"/sse/'    '"$ingress/sse/';
            sub_filter "'/sse/"    "'$ingress/sse/";
            sub_filter '"/docs"'   '"$ingress/docs"';
            sub_filter "'/docs'"   "'$ingress/docs'";
            sub_filter '"/openapi' '"$ingress/openapi';
        }
    }
}
